name: flutterpay
description: A dynamic, multi-gateway global payment router for Flutter. Securely route payments to Stripe, Paystack, Stitch, Ozow, and more based on user location.
version: 1.0.0
homepage: https://github.com/yourusername/flutterpay

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.1.0
  webview_flutter: ^4.4.2
  uuid: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  assets:
    - assets/flutterpay_logo.png
